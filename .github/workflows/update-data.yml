name: Update live news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch feeds
        run: node scripts/update-data.mjs
      - name: Save if changed
        run: |
          git config user.name "queerham-bot"
          git config user.email "queerham-bot@users.noreply.github.com"
          git add data/feeds.json
          git diff --cached --quiet || git commit -m "Update live news"
          git push
